name: 'Forge Verify'
description: 'Verifies an AI implementation against its task contract using Atoryn Forge'
inputs:
  contract-path:
    description: 'Path to the contract JSON'
    required: true
  implementer-provider:
    description: 'The provider of the implementation'
    required: false
    default: 'github-actions'
  implementer-run:
    description: 'The run ID for the implementer'
    required: false
    default: ${{ github.run_id }}
  fail-on-inconclusive:
    description: 'Whether to fail the CI if the verdict is inconclusive'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Run Forge Verify
      id: forge-verify
      shell: bash
      run: |
        set +e
        npx atoryn-forge verify --contract "${{ inputs.contract-path }}" \
          --implementer-provider "${{ inputs.implementer-provider }}" \
          --implementer-run "${{ inputs.implementer-run }}" \
          --trusted-repository \
          --json > forge-result.json
        EXIT_CODE=$?
        set -e
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

    - name: Post PR Comment
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          if (!fs.existsSync('forge-result.json')) {
            console.log('No forge-result.json found.');
            return;
          }

          try {
            const result = JSON.parse(fs.readFileSync('forge-result.json', 'utf8'));
            const evidence = result.evidence;
            if (!evidence) return;

            let verdictIcon = '❔';
            if (evidence.verdict === 'accepted') verdictIcon = '✅';
            if (evidence.verdict === 'rejected') verdictIcon = '❌';

            const checksPassed = evidence.checks.length;
            const risksCount = evidence.unresolvedRisks ? evidence.unresolvedRisks.length : 0;

            const body = `## Forge Verification Result ${verdictIcon}

            **Verdict:** \`${evidence.verdict.toUpperCase()}\`

            - **Task ID:** \`${evidence.taskId}\`
            - **Task State:** \`${result.state ?? 'unknown'}\`
            - **Scope Status:** \`${evidence.scope.status}\`
            - **Changes:** ${evidence.subject.changes.length} files modified
            - **Checks:** ${checksPassed} passed
            - **Risks:** ${risksCount} unresolved

            *Verified by Atoryn Forge*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          } catch (e) {
            console.error('Error posting comment:', e);
          }

    - name: Evaluate Outcome
      shell: bash
      run: |
        EXIT_CODE="${{ steps.forge-verify.outputs.exit_code }}"
        if [ "$EXIT_CODE" -eq 2 ]; then
          echo "Forge verification REJECTED."
          exit 1
        elif [ "$EXIT_CODE" -eq 3 ] && [ "${{ inputs.fail-on-inconclusive }}" = "true" ]; then
          echo "Forge verification INCONCLUSIVE."
          exit 1
        elif [ "$EXIT_CODE" -eq 0 ] || [ "$EXIT_CODE" -eq 3 ]; then
          echo "Forge verification passed or inconclusive (allowed)."
          exit 0
        else
          echo "Forge CLI failed with exit code $EXIT_CODE."
          exit 1
        fi
